workflows:
  android-workflow:
    name: Compilar APK Android
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generar componentes nativos de Android
        script: flutter create . --platforms=android --org com.redmesh.app
      - name: Descargar dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
